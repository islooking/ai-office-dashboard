<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>魔法學院｜AI 辦公室像素地圖</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #94a3b8;
      --wall: #a78b6d;
      --wall-dark: #7c6548;
      --wall-light: #c4a882;
      --door-void: #1e293b;
      --door-frame: #475569;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang HK", "Noto Sans TC", sans-serif;
      background: #0b1220;
      color: #e2e8f0;
      min-height: 100vh;
    }
    header { padding: 18px 20px 6px; text-align: center; }
    header h1 { font-size: 1.12rem; margin: 0 0 6px; }
    header p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .badge {
      display: inline-block; margin-top: 10px; padding: 4px 10px;
      border-radius: 999px; background: #1e293b; color: #4ade80;
      font-size: 0.72rem; border: 1px solid #334155;
    }
    .links { margin-top: 8px; font-size: 0.8rem; }
    .links a { color: #7dd3fc; margin: 0 8px; }
    .campus {
      max-width: 1280px;
      margin: 14px auto 28px;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      background:
        linear-gradient(90deg, rgba(148,163,184,.07) 1px, transparent 1px) 0 0 / 16px 16px,
        linear-gradient(rgba(148,163,184,.07) 1px, transparent 1px) 0 0 / 16px 16px,
        #111827;
      border: 3px solid #475569;
      border-radius: 12px;
    }
    .wing {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 10px;
      color: #64748b; font-size: 0.72rem; font-weight: 700; letter-spacing: .18em;
      padding: 2px 4px;
    }
    .wing::before, .wing::after {
      content: ""; flex: 1; height: 10px;
      background: repeating-linear-gradient(90deg, #94a3b8 0 8px, #64748b 8px 10px, #cbd5e1 10px 18px);
      border-radius: 2px; opacity: .55;
    }
    .room {
      position: relative;
      border: 3px solid var(--wall-dark);
      border-top: none;
      border-radius: 2px;
      overflow: visible;
      min-height: 426px;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.22),
        0 4px 0 rgba(0,0,0,.25);
    }
    .room:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.3),
        0 8px 20px rgba(0,0,0,.35);
    }
    .top-wall {
      position: absolute;
      top: 0; left: -3px; right: -3px;
      height: 44px;
      background:
        linear-gradient(180deg, var(--wall-light) 0 8px, var(--wall) 8px 34px, var(--wall-dark) 34px 100%);
      border: 3px solid var(--wall-dark);
      border-bottom: 2px solid var(--wall-dark);
      z-index: 5;
      box-sizing: border-box;
    }
    .door {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 36px;
      z-index: 6;
      display: flex;
      gap: 2px;
      background: var(--door-void);
      border: 2px solid var(--door-frame);
      border-bottom: none;
      box-shadow:
        inset 0 4px 0 rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.15);
    }
    .door::before,
    .door::after {
      content: "";
      flex: 1;
      background:
        linear-gradient(90deg, transparent 0 40%, #334155 40% 48%, transparent 48%),
        linear-gradient(180deg, #0f172a 0%, #1e293b 60%, #334155 100%);
      box-shadow: inset 0 0 0 1px #475569;
    }
    .door-knob-l,
    .door-knob-r {
      position: absolute;
      top: 18px;
      width: 4px;
      height: 4px;
      background: #fbbf24;
      border-radius: 1px;
      z-index: 7;
    }
    .door-knob-l { left: 18px; }
    .door-knob-r { right: 18px; }
    .room-name {
      position: absolute;
      z-index: 4;
      background: rgba(15,23,42,.82);
      color: #f8fafc;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,.16);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Offices + meetings (Look t894–t899u): tan top-wall, right of door, top = door top */
    .room .room-name {
      top: 6px;
      left: calc(50% + 26px);
      max-width: calc(50% - 90px);
      z-index: 14;
      pointer-events: none;
    }
    .status,
    .status-counts {
      position: absolute;
      top: 56px; /* 文件櫃腳對落少少，唔重疊 */
      right: 8px;
      z-index: 4;
      font-size: 0.66rem;
      font-weight: 700;
    }
    .status {
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,.12);
    }
    .status-counts {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 3px;
      max-width: 52%;
    }
    .status-counts .status-chip {
      padding: 2px 5px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,.12);
      white-space: nowrap;
      line-height: 1.2;
    }
    .status.doing, .status-chip.doing { background: #38bdf8; color: #0c4a6e; }
    .status.done, .status-chip.done { background: #4ade80; color: #14532d; }
    .status.pending, .status-chip.pending { background: #fbbf24; color: #78350f; }
    .status.hold, .status-chip.hold { background: #fb923c; color: #7c2d12; }
    .status.error, .status-chip.error { background: #f87171; color: #7f1d1d; }
    .status.idle, .status-chip.idle { background: #94a3b8; color: #0f172a; }
    .status.meeting { background: #c4b5fd; color: #4c1d95; }
    .furn-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12; /* 牆傢俬最前，唔俾頂牆蓋住 */
    }
    .furn {
      position: absolute;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(1px 1px 0 rgba(0,0,0,.2));
    }
    /* 牆傢俬：貼頂牆、細一半、喺名牌／狀態之上；底角：闊文件櫃＋直立大咖啡機 */
    .furn-cabinet {
      top: 4px;
      left: 4px;
      width: auto;
      height: 48px; /* 六櫃平排正面貼牆 */
      max-width: 55%;
      z-index: 7;
      image-rendering: pixelated;
    }
    .furn-whiteboard {
      top: 6px;
      right: 40px;
      width: 45px; /* 而家一半 */
      height: auto;
      z-index: 7;
    }
    .furn-clock {
      top: 8px;
      right: 8px;
      width: 16px; /* 細一半 */
      height: auto;
      z-index: 7;
    }
    .furn-plant {
      bottom: 6px;
      left: 100px; /* 貼近公仔 */
      width: 34px;
      height: auto;
      z-index: 1;
    }
    .furn-coffee {
      bottom: 4px;
      right: 4px;
      width: 160px; /* 細返三分一 */
      height: auto;
      z-index: 2;
      image-rendering: pixelated;
    }
    .desk-zone {
      position: absolute;
      left: 4px;
      bottom: 4px;
      width: 118px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .sprite {
      /* Visual size locked to 智子 footprint (skill); all desk PNGs share this box */
      width: 118px;
      max-width: 100%;
      height: 118px;
      object-fit: contain;
      object-position: bottom center;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      image-rendering: auto;
      display: block;
      filter: drop-shadow(1px 2px 0 rgba(0,0,0,.18));
    }
    .sprite-tag {
      margin-top: -2px;
      font-size: 0.58rem;
      font-weight: 700;
      color: #0f172a;
      background: rgba(255,255,255,.78);
      padding: 1px 5px;
      border-radius: 3px;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Office progress: same gap top & bottom on all viewports (Look t883u/t885u).
       gap = room-name bottom → progress top = progress bottom → sprite head (~7px).
       Desktop = former top:80 / bottom:110 with sprite 118px. Meetings share --office-gap. */
    .room:not(.meeting) {
      --office-gap: 7px;
      --label-top: 56px;
      --label-h: 17px;
      --sprite-h: 118px;
      --desk-bottom: 4px;
      /* 118 + 4 - 19 + 7 = 110 */
      --progress-bottom: calc(var(--sprite-h) + var(--desk-bottom) - 19px + var(--office-gap));
    }
    .progress {
      position: absolute;
      top: 80px; /* default; office overrides below; meetings override later */
      left: 8px;
      right: 8px;
      bottom: 110px;
      max-height: none;
      height: auto;
      transform: none;
      z-index: 3;
      background: rgba(15,23,42,.52);
      color: #f1f5f9;
      font-size: 0.72rem;
      line-height: 1.4;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,.14);
      overflow: auto;
      backdrop-filter: blur(0.5px);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
    }
    .room:not(.meeting) .progress {
      top: calc(var(--label-top) + var(--label-h) + var(--office-gap));
      bottom: var(--progress-bottom);
    }
    .progress .meet-roster {
      font-size: 0.7rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
      line-height: 1.45;
      flex-wrap: wrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .progress .meet-roster .host-mark {
      display: inline-block;
      font-size: 0.58rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      background: #fde68a;
      color: #78350f;
      border: 1px solid rgba(120,53,15,.25);
      margin-right: 2px;
      letter-spacing: .02em;
    }
    .progress .meet-roster .host-name {
      font-weight: 800;
      color: #fde68a;
    }
    .progress .meet-roster .roster-sep {
      color: #64748b;
      font-weight: 400;
    }
    .progress .prog-head {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .progress .task-line {
      padding: 3px 0;
      border-bottom: 1px solid rgba(148,163,184,.18);
    }
    .progress .task-line:last-child { border-bottom: none; }
    .progress .task-meta {
      display: inline-block;
      font-weight: 700;
      font-size: 0.62rem;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,.12);
      vertical-align: baseline;
    }
    .progress .task-meta.doing { background: #38bdf8; color: #0c4a6e; }
    .progress .task-meta.done { background: #4ade80; color: #14532d; }
    .progress .task-meta.pending { background: #fbbf24; color: #78350f; }
    .progress .task-meta.hold { background: #fb923c; color: #7c2d12; }
    .progress .task-meta.error { background: #f87171; color: #7f1d1d; }
    .progress .task-meta.idle { background: #94a3b8; color: #0f172a; }
    .progress .task-more {
      margin-top: 4px;
      color: #94a3b8;
      font-size: 0.64rem;
    }

    /* Usage strip above 抉擇塔 (Look t890u) */
    .usage-bar {
      grid-column: 1 / -1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      color: #e2e8f0;
    }
    .usage-bar h2 {
      margin: 0 0 10px;
      font-size: 0.86rem;
      color: #7dd3fc;
      font-weight: 700;
    }
    .usage-bar h2 span {
      font-size: 0.68rem;
      color: #64748b;
      font-weight: 400;
      margin-left: 6px;
    }
    .usage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
    }
    @media (max-width: 720px) {
      .usage-grid { grid-template-columns: 1fr; }
    }
    .usage-block .usage-label {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .usage-block .usage-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
      gap: 8px;
    }
    .usage-block .usage-pct {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .usage-block .usage-pct em {
      font-style: normal;
      font-size: 0.75rem;
      font-weight: 400;
      color: #94a3b8;
      margin-left: 4px;
    }
    .usage-block .usage-reset {
      font-size: 0.7rem;
      color: #94a3b8;
      white-space: nowrap;
    }
    .usage-meter {
      background: #334155;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }
    .usage-meter > i {
      display: block;
      height: 100%;
      flex: 0 0 auto;
      width: 0%;
      background: #60a5fa;
    }
    .usage-meter > i.seg-imagine { background: #60a5fa; }
    .usage-meter > i.seg-builder { background: #3b82f6; }
    .usage-meter > i.seg-chat { background: #1d4ed8; }
    .usage-meter > i.warn { background: #fbbf24; }
    .usage-meter > i.hot { background: #f87171; }
    .usage-chips {
      margin-top: 6px;
      font-size: 0.7rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .usage-chips .dot { font-weight: 600; }
    .usage-chips .dot-imagine { color: #60a5fa; }
    .usage-chips .dot-builder { color: #3b82f6; }
    .usage-chips .dot-chat { color: #1d4ed8; }
    .usage-footer {
      margin: 8px 0 0;
      font-size: 0.68rem;
      color: #64748b;
    }
    .usage-bar .usage-err { color: #f87171; font-size: 0.8rem; margin: 0; }
    .usage-bar .usage-muted { color: #94a3b8; font-size: 0.8rem; margin: 0; }

    .note {
      max-width: 980px; margin: 0 auto 40px; padding: 0 16px;
      color: var(--muted); font-size: 0.84rem; line-height: 1.5; text-align: center;
    }

    /* Meeting rooms: full width; equal-gap like office top box (Look t885–t888).
       CSS vars = fallback; syncMeetingGaps() measures room-name & .meet-name and sets
       progress top/bottom so both gaps = --office-gap on phone + desktop. */
    .room.meeting {
      grid-column: 1 / -1;
      min-height: 640px; /* dialogue + gap + bottom-pinned square vignette */
      cursor: default;
      --office-gap: 7px;
      --label-top: 56px;
      --label-h: 17px;
      --stage-bottom: 8px;
      --stage-max: 400px;
      --stage-pct: 76%;
      --name-above-anchor: 16px; /* meet-name above ~top 20% head anchor (net 1× size) */
    }
    .room.meeting:hover {
      transform: none;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.22),
        0 4px 0 rgba(0,0,0,.25);
    }
    .room.meeting .progress {
      top: calc(var(--label-top) + var(--label-h) + var(--office-gap));
      left: 8px;
      right: 8px;
      height: auto;
      bottom: calc(
        var(--stage-bottom) + 0.4 * min(var(--stage-max), var(--stage-pct))
        + var(--name-above-anchor) + var(--office-gap)
      );
      z-index: 5; /* above stage — never underlap sprites/table */
    }
    .room.meeting .furn-plant-l {
      bottom: 6px;
      left: 8px;
      width: 34px;
      height: auto;
      z-index: 1;
    }
    .room.meeting .furn-plant-r {
      bottom: 6px;
      right: 8px;
      left: auto;
      width: 34px;
      height: auto;
      z-index: 1;
    }
    /* Absolute seating: one shared scale — person+chair+oval+laptop */
    .meeting-stage {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 4px;
      width: min(460px, 78%);
      height: 220px;
      z-index: 2;
      pointer-events: none;
    }
    /* Layer: back seats → table → props → front seats */
    .meeting-table {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      /* Locked oval = furn-meeting-table-oval (磁鐵改靚 standard); half prior display */
      width: min(100px, 36%);
      height: auto;
      z-index: 3;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(1px 2px 0 rgba(0,0,0,.28));
      display: block;
    }
    .seat {
      position: absolute;
      width: 76px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .seat .sprite {
      width: 70px;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(1px 1px 0 rgba(0,0,0,.25));
      display: block;
      position: relative;
    }
    .seat .sprite-tag {
      margin-top: -6px;
      font-size: 0.48rem;
      max-width: 68px;
      text-align: center;
      line-height: 1.1;
      color: #0f172a;
      background: rgba(255,255,255,.72);
      border-radius: 4px;
      padding: 1px 3px;
      z-index: 7;
      position: relative;
    }
    /* Props ON oval, hand-sized vs person */
    .meet-prop {
      position: absolute;
      width: 18px;
      height: auto;
      z-index: 6;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.35));
      pointer-events: none;
      transform: translateX(-50%);
    }
    .meet-prop.back {
      top: 42%; /* on far half, in front of back sitter facing center */
    }
    .meet-prop.front {
      top: 54%; /* on near half, in front of front sitter facing center */
    }
    .seat.back {
      top: 2px; /* tuck to far table edge — faces into table center */
      z-index: 1;
    }
    .seat.front {
      bottom: 0;
      z-index: 5;
    }
    /* When only one side occupied, keep group visually centered on table */
    .meeting-stage.solo-side .meeting-table {
      top: 58%;
    }
    .meeting-stage.solo-side .seat.back {
      top: 18px;
    }
    .meeting-stage.solo-side .meet-prop.back {
      top: 52%;
    }
    /* Inward facing: left sitters lean toward center-right; right toward center-left */
    .seat { transform: translateX(-50%); }
    .seat.face-in-right .sprite { transform: scaleX(1) rotate(0deg); }
    .seat.face-in-left .sprite { transform: scaleX(-1); }
    .seat.front.face-in-right .sprite { transform: scaleX(-1); }
    .seat.front.face-in-left .sprite { transform: scaleX(1); }


    /* Meeting vignette: people from dba2641; CSS only nudges stage UP (table closer to room mid).
       Do not remake baked people PNGs. Tags % relative to vignette-wrap (= image). */
    .meeting-stage.vignette-mode {
      width: min(var(--stage-max, 400px), var(--stage-pct, 76%));
      height: auto;
      bottom: 28px; /* table+group up a little vs flush-bottom */
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .vignette-wrap {
      position: relative;
      width: 100%;
      line-height: 0;
    }
    .meeting-vignette {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: auto;
      filter: drop-shadow(1px 2px 0 rgba(0,0,0,.28));
      position: relative;
      z-index: 1;
    }
    /* Look t863u/t864u: all three meetings — scale original vignette ×0.5 (details unchanged),
       then pin table legs to plant tops. Plant CSS: bottom 6px, width 34px, asset 67×96 → ~49px tall;
       plant top ≈ 55px from room bottom. Do NOT remake PNGs. ONLY CSS size/position. */
    .room.meeting[data-meeting="parse-brand"] .meeting-stage.vignette-mode,
    .room.meeting[data-meeting="decision-tower"] .meeting-stage.vignette-mode,
    .room.meeting[data-meeting="parse-magnet"] .meeting-stage.vignette-mode {
      transform: translateX(-50%) scale(0.5);
      transform-origin: bottom center;
      /* Move whole vignette (people+chairs+table) straight down: table legs = plant tops.
         Plant top ≈ 55px; vignette PNG has ~23.6% empty below content → bottom ≈ 8px. */
      bottom: 8px;
    }
    /* Meeting progress bottom: see .room.meeting .progress equal-gap formula. */

    /* Name labels tight beside head/shoulder — never over dialogue (dialogue is above stage) */
    .meet-name {
      position: absolute;
      font-size: 0.58rem;
      font-weight: 700;
      line-height: 1.1;
      color: #0f172a;
      background: rgba(255,255,255,.9);
      border-radius: 3px;
      padding: 1px 3px;
      white-space: nowrap;
      z-index: 8;
      pointer-events: none;
      box-shadow: 0 1px 0 rgba(0,0,0,.12);
    }
    .meet-name.side-center { transform: translate(-50%, -100%); }
    .meet-name.side-right { transform: translate(-100%, -50%); } /* tag left of sprite */
    .meet-name.side-left { transform: translate(0, -50%); } /* tag right of sprite */
    /* All three rooms stage is scale(0.5) — counter-scale names so they match office meet-name size.
       Facing-us sitters: tags sit just above head (not in empty top pad). Look t863u/t864u. */

    /* Locked meeting table asset — oval from bottom room 磁鐵改靚; do not swap shape. */
    const MEETING_TABLE = 'furn-meeting-table-oval.png';
    const FURN_V = 'furn31';
    const SPRITE_V = 'meet19';
    const SEAT_V = 'seat12';
    const VIGNETTE_V = 'vig19'; /* Look t870u: progress expand down just above names */


    function checker(tint) {
      return `background-color:${tint};background-image:linear-gradient(45deg,rgba(255,255,255,.22) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.22) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.22) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.22) 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;`;
    }

    function parseCsvLine(line) {
      const out = []; let cur = ''; let q = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          if (q && line[i + 1] === '"') { cur += '"'; i++; }
          else q = !q;
        } else if (c === ',' && !q) { out.push(cur); cur = ''; }
        else cur += c;
      }
      out.push(cur);
      return out;
    }

    /* Evenly space seats along the oval (left% of stage). n seats → centers. */
    function seatLeftPercents(n) {
      if (n <= 0) return [];
      if (n === 1) return [50];
      /* Keep sitters over the oval edge, facing center */
      if (n === 2) return [40, 60];
      if (n === 3) return [34, 50, 66];
      return Array.from({ length: n }, (_, i) => 30 + (i * 40) / (n - 1));
    }

    function splitSeats(members) {
      /* max 6. 1–3 all same side; 4→2+2; 5→3+2; 6→3+3 */
      const n = Math.min(members.length, 6);
      const list = members.slice(0, n);
      if (n <= 3) return { back: list, front: [] };
      if (n === 4) return { back: list.slice(0, 2), front: list.slice(2) };
      if (n === 5) return { back: list.slice(0, 3), front: list.slice(3) };
      return { back: list.slice(0, 3), front: list.slice(3) }; /* 6 → 3+3 */
    }

    function propFile(side, i) {
      /* Black laptops only — no notebooks (Look 2026-10-25). */
      if (side === 'back') return 'laptop-back.png';
      return 'laptop-face-n.png';
    }

    function seatHtml(m, side, leftPct, rowN, idx) {
      /* back=face camera into table; front=back-to-camera into table */
      const dir = side === 'back' ? 's' : 'n';
      const file = `${m.seat}-${dir}.png`;
      /* left/right of a row angle slightly toward table center */
      let face = 'face-mid';
      if (rowN >= 2) {
        if (idx === 0) face = 'face-in-right'; /* left seat looks toward center */
        else if (idx === rowN - 1) face = 'face-in-left';
      }
      const spr = `<img class="sprite" src="pixel-assets/${file}?v=${SEAT_V}" alt="${m.name}" />`;
      const tag = `<span class="sprite-tag">${m.name}</span>`;
      return `<div class="seat ${side} ${face}" style="left:${leftPct}%;">${spr}${tag}</div>`;
    }

    function propHtml(side, leftPct, propIdx) {
      const prop = propFile(side, propIdx);
      return `<img class="meet-prop ${side}" style="left:${leftPct}%;" src="pixel-assets/${prop}?v=${SEAT_V}" alt="" />`;
    }

    function meetingRosterHtml(m) {
      const host = m.host || '';
      const others = m.members.map(x => x.name).filter(n => n !== host);
      const ordered = host ? [host, ...others] : m.members.map(x => x.name);
      const parts = ordered.map((n, i) => {
        if (host && n === host && i === 0) {
          return `<span class="host-mark">主持</span><span class="host-name">${n}</span>`;
        }
        return `<span>${n}</span>`;
      });
      return parts.join('<span class="roster-sep"> · </span>');
    }

    function meetingRoomHtml(m) {
      const { back, front } = splitSeats(m.members);
      let stage;
      if (m.vignette) {
        /* One composed vignette + HTML name labels tight beside each head */
        const nameTags = m.members.map(mem => {
          const t = mem.tag || { left: 50, top: 8, side: 'center' };
          const side = t.side || 'center';
          return `<span class="meet-name side-${side}" style="left:${t.left}%;top:${t.top}%;">${mem.name}</span>`;
        }).join('');
        stage = `
          <div class="meeting-stage vignette-mode" aria-hidden="true">
            <div class="vignette-wrap">
              <img class="meeting-vignette" src="pixel-assets/${m.vignette}?v=${VIGNETTE_V}" alt="" />
              ${nameTags}
            </div>
          </div>`;
      } else {
        const backLefts = seatLeftPercents(back.length);
        const frontLefts = seatLeftPercents(front.length);
        const solo = front.length === 0 ? ' solo-side' : '';
        const backSeats = back.map((mem, i) => seatHtml(mem, 'back', backLefts[i], back.length, i)).join('');
        const frontSeats = front.map((mem, i) => seatHtml(mem, 'front', frontLefts[i], front.length, i)).join('');
        const props =
          back.map((_, i) => propHtml('back', backLefts[i], i)).join('') +
          front.map((_, i) => propHtml('front', frontLefts[i], i + back.length)).join('');
        stage = `
          <div class="meeting-stage${solo}" aria-hidden="true">
            ${backSeats}
            <img class="meeting-table" src="pixel-assets/${MEETING_TABLE}?v=${FURN_V}" alt="" />
            ${props}
            ${frontSeats}
          </div>`;
      }
      return `
          <div class="top-wall" aria-hidden="true"></div>
          <div class="door" aria-hidden="true" title="門口">
            <span class="door-knob-l"></span>
            <span class="door-knob-r"></span>
          </div>
          <div class="furn-layer" aria-hidden="true">
            <img class="furn furn-cabinet" src="pixel-assets/furn-cabinet-6flat.png?v=${FURN_V}" alt="" />
            <img class="furn furn-whiteboard" src="pixel-assets/furn-whiteboard.png?v=${FURN_V}" alt="" />
            <img class="furn furn-clock" src="pixel-assets/furn-clock.png?v=${FURN_V}" alt="" />
            <img class="furn furn-plant furn-plant-l" src="pixel-assets/furn-plant.png?v=${FURN_V}" alt="" />

          </div>
          <div class="room-name">${m.name}</div>

          <div class="progress" data-tasks>
            <div class="meet-roster">${meetingRosterHtml(m)}</div>
            <div class="prog-head">最新進度</div>
            <div class="task-line"><span class="task-meta idle">會議室</span> · ${m.blurb}</div>
            <div class="task-more">座位最多 6 人 · 1–3 同邊 · 4＝2+2 · 分身可跨房</div>
          </div>
          ${stage}
        `;
    }

    function appendMeeting(root, m) {
      const el = document.createElement('div');
      el.className = 'room meeting';
      el.dataset.meeting = m.key;
      el.style.cssText = checker(m.tint);

    function appendBotRoom(root, b) {
      const el = document.createElement('div');
      el.className = 'room';
      el.dataset.bot = b.name;
      el.style.cssText = checker(b.tint);
      el.onclick = () => { location.href = 'grokbot://app/v1/agent?id=' + b.id; };

          <div class="door" aria-hidden="true" title="門口">

      root.appendChild(el);

    function buildCampus() {
      const root = document.getElementById('campus');
      root.innerHTML = '';

      /* 0) Usage strip directly above 抉擇塔 (Look t890u) */
      const usage = document.createElement('div');
      usage.className = 'usage-bar';

      usage.innerHTML = '<h2>使用情況<span>Sheet 驅動</span></h2><p class="usage-muted">載入用量中...</p>';
      root.appendChild(usage);

      /* 1) 抉擇塔 above all individual rooms */
      const wingTop = document.createElement('div');
      wingTop.className = 'wing';
      wingTop.textContent = '會議室 · 抉擇塔';
      root.appendChild(wingTop);
      MEETINGS.top.forEach(m => appendMeeting(root, m));

      /* 2) Individual bot offices */
      BOTS.forEach(b => {
        if (b.wing) {
          const w = document.createElement('div');
          w.className = 'wing';
          w.textContent = b.wing;
          root.appendChild(w);
        }
        appendBotRoom(root, b);
      });

      /* 3) Other meeting rooms below all offices */
      const wingBot = document.createElement('div');
      wingBot.className = 'wing';
      wingBot.textContent = '會議室';
      root.appendChild(wingBot);
      MEETINGS.bottom.forEach(m => appendMeeting(root, m));
    }

    async function loadSheet() {
      try {
        const res = await fetch(SHEET_URL);
        if (!res.ok) throw new Error('fetch');
        const csv = await res.text();
        const lines = csv.trim().split(/\r?\n/);
        if (lines.length < 2) throw new Error('empty');
        const rows = lines.slice(1).map(line => {
          const cols = parseCsvLine(line).map(c => c.replace(/^"|"$/g, ''));
          return {
            task: cols[1] || '',
            bot: cols[3] || '',
            status: (cols[4] || '').trim().toLowerCase(),
            summary: cols[5] || '',
            notes: cols[8] || ''
          };
        }).filter(r => r.bot);

        const byBot = {};
        rows.forEach(r => {
          if (!byBot[r.bot]) byBot[r.bot] = [];
          byBot[r.bot].push(r);
        });

        document.querySelectorAll('.room[data-bot]').forEach(el => {
          const bot = el.dataset.bot;
          const list = byBot[bot] || [];
          const statusEl = el.querySelector('[data-status]');
          const tasksEl = el.querySelector('[data-tasks]');
          if (!list.length) {
            statusEl.className = 'status-counts';
            statusEl.innerHTML = '<span class="status-chip idle">暫無</span>';
            tasksEl.innerHTML = '<div class="prog-head">最新進度</div>（暫無手上任務）';
            return;
          }
          /* Right corner: count each status that exists (Look t892u) */
          const counts = {};
          list.forEach(r => {
            const key = (r.status || '').trim().toLowerCase() || 'idle';
            counts[key] = (counts[key] || 0) + 1;
          });
          const order = ['doing', 'pending', 'hold', 'error', 'done'];
          const chips = [];
          order.forEach(k => {
            if (!counts[k]) return;
            const m = STATUS_META[k] || { label: k, cls: k };
            chips.push(`<span class="status-chip ${m.cls}">${m.label}×${counts[k]}</span>`);
            delete counts[k];
          });
          Object.keys(counts).forEach(k => {
            const m = STATUS_META[k] || { label: k, cls: 'idle' };
            chips.push(`<span class="status-chip ${m.cls}">${m.label}×${counts[k]}</span>`);
          });
          statusEl.className = 'status-counts';
          statusEl.innerHTML = chips.join('') || '<span class="status-chip idle">暫無</span>';

          const shown = list.slice().reverse(); /* 唔限五行，房內 scroll 睇晒 */
          const linesHtml = shown.map(r => {
            const m = STATUS_META[r.status] || { label: r.status || '—', cls: 'idle' };
            let detail = '';
            if (r.status === 'done' && r.summary) detail = r.summary;
            else if (r.status === 'hold' && (r.notes || r.summary)) detail = r.notes || r.summary;
            else detail = r.task || r.summary || '';
            return `<div class="task-line"><span class="task-meta ${m.cls}">${m.label}</span>${detail ? ' · ' + detail : ''}</div>`;
          });
          tasksEl.innerHTML = '<div class="prog-head">最新進度</div>' + linesHtml.join('');
        });
      } catch (e) {
        document.querySelectorAll('.room[data-bot] [data-tasks]').forEach(el => {
          el.innerHTML = '<div class="prog-head">最新進度</div>讀取失敗（請確認 Sheet 公開可檢視）';
        });
      }
    }

    /* Meeting progress: top from status-row; bottom from .meet-name (Look t885–t899).
       Door-side .room-name is display-only. CSS bottom formula is fallback only. */
    function meetingGapPx(room) {
      const raw = getComputedStyle(room).getPropertyValue('--office-gap').trim();
      const n = parseFloat(raw);
      return Number.isFinite(n) ? n : 7;
    }

    function syncMeetingGaps() {
      document.querySelectorAll('.room.meeting').forEach(room => {
        /* Top gap from status-row band (top:56px), not door-side room-name (Look t899u) */
        const label = room.querySelector('[data-status]') || room.querySelector('.status');
        const prog = room.querySelector('.progress');
        const names = room.querySelectorAll('.meet-name');
        if (!prog || !names.length) return;
        const gap = meetingGapPx(room);
        const roomRect = room.getBoundingClientRect();
        if (roomRect.height < 40) return;
        const cs = getComputedStyle(room);
        const labelTop = parseFloat(cs.getPropertyValue('--label-top')) || 56;
        const labelH = parseFloat(cs.getPropertyValue('--label-h')) || 17;
        let topPx;
        if (label) {
          const labelRect = label.getBoundingClientRect();
          topPx = Math.max(0, labelRect.bottom - roomRect.top + gap);
        } else {
          topPx = Math.max(0, labelTop + labelH + gap);
        }
        let nameTop = Infinity;
        names.forEach(n => {
          const r = n.getBoundingClientRect();
          if (r.height > 0) nameTop = Math.min(nameTop, r.top);
        });
        if (!Number.isFinite(nameTop)) return;
        let bottomPx = Math.max(0, roomRect.bottom - nameTop + gap);
        /* Keep a usable progress band — clamp, never skip (skip left CSS fallback unequal on phone) */
        const minBand = 80;
        const h = roomRect.height;
        if (h - topPx - bottomPx < minBand) {
          const need = topPx + bottomPx + minBand - h;
          const cutTop = Math.min(topPx, need / 2);
          const cutBot = need - cutTop;
          topPx = Math.max(0, topPx - cutTop);
          bottomPx = Math.max(0, bottomPx - cutBot);
        }
        prog.style.top = topPx + 'px';
        prog.style.bottom = bottomPx + 'px';
        prog.style.height = 'auto';
      });
    }

    function scheduleMeetingGaps() {
      syncMeetingGaps();
      requestAnimationFrame(syncMeetingGaps);
    }


    const USAGE_SHEET_ID = '1kA0LedNEBXJhUhMKuY2XQxdugtC8_UhsUtgt5aljOLo';
    const USAGE_SHEET_URL = `https://docs.google.com/spreadsheets/d/${USAGE_SHEET_ID}/gviz/tq?tqx=out:csv`;

    function usageFillClass(pct) {
      const n = Number(pct);
      if (n >= 85) return 'hot';
      if (n >= 60) return 'warn';
      return '';
    }

    async function loadUsage() {
      const el = document.getElementById('usageBar');
      if (!el) return;
      try {
        const res = await fetch(USAGE_SHEET_URL);
        if (!res.ok) throw new Error('fetch');
        const csv = await res.text();
        const lines = csv.trim().split(/\r?\n/).filter(Boolean);
        if (lines.length < 2) {
          el.innerHTML = '<h2>使用情況<span>Sheet 驅動</span></h2><p class="usage-muted">暫無用量記錄</p>';
          return;
        }
        const cols = parseCsvLine(lines[lines.length - 1]).map(c => c.replace(/^"|"$/g, ''));
        const sg = cols[1] || '0';
        const bot = cols[3] || '0';
        const imagine = Number(cols[5]) || 0;
        const builder = Number(cols[6]) || 0;
        const chat = Number(cols[7]) || 0;
        const botCls = usageFillClass(bot);
        el.innerHTML = `
          <h2>使用情況<span>Sheet 驅動</span></h2>
          <div class="usage-grid">
            <div class="usage-block">
              <div class="usage-label">每週 SuperGrok Plus</div>
              <div class="usage-row">
                <div class="usage-pct">${sg}%<em>已使用</em></div>
                <div class="usage-reset">重設 ${cols[2] || '—'}</div>
              </div>
              <div class="usage-meter" aria-label="SuperGrok Plus 分段用量">
                <i class="seg-imagine" style="width:${Math.min(100, imagine)}%"></i>
                <i class="seg-builder" style="width:${Math.min(100, builder)}%"></i>
                <i class="seg-chat" style="width:${Math.min(100, chat)}%"></i>
              </div>
              <div class="usage-chips">
                <span class="dot dot-imagine">●</span> Imagine ${imagine}%　
                <span class="dot dot-builder">●</span> App Builder ${builder}%　
                <span class="dot dot-chat">●</span> 對話 ${chat}%
              </div>
            </div>
            <div class="usage-block">
              <div class="usage-label">每週 Grok Bot</div>
              <div class="usage-row">
                <div class="usage-pct">${bot}%<em>已使用</em></div>
                <div class="usage-reset">重設 ${cols[4] || '—'}</div>
              </div>
              <div class="usage-meter"><i class="${botCls}" style="width:${Math.min(100, Number(bot) || 0)}%"></i></div>
            </div>
          </div>
          <p class="usage-footer">最後更新：${cols[0] || '—'}</p>
        `;
      } catch (e) {
        el.innerHTML = '<h2>使用情況<span>Sheet 驅動</span></h2><p class="usage-err">讀取用量失敗（確認 Sheet 公開／Anyone with link）</p>';
      }
    }

    buildCampus();
    scheduleMeetingGaps();
    loadSheet();
    loadUsage();
    setInterval(loadSheet, 60000);
    setInterval(loadUsage, 60000);
    window.addEventListener('resize', scheduleMeetingGaps);
    document.querySelectorAll('.meeting-vignette').forEach(img => {
      if (img.complete) return;
      img.addEventListener('load', scheduleMeetingGaps, { once: true });
    });
  </script>
</body>
</html>
